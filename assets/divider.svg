<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 20" width="100%" height="20">
  <defs>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0D1117;stop-opacity:1" />
      <stop offset="20%" style="stop-color:#8A2BE2;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00F0FF;stop-opacity:1" />
      <stop offset="80%" style="stop-color:#8A2BE2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D1117;stop-opacity:1" />
    </linearGradient>
    <filter id="blur" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="3" />
    </filter>
  </defs>
  
  <rect x="0" y="8" width="800" height="4" fill="url(#glow)" filter="url(#blur)" />
  <rect x="0" y="9" width="800" height="2" fill="#FFFFFF" opacity="0.8" />
  
  <!-- Central node -->
  <polygon points="400,2 408,10 400,18 392,10" fill="#00F0FF" />
  <circle cx="400" cy="10" r="2" fill="#FFFFFF" />
</svg>
