<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 30" width="100%" height="30">
  <defs>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <path d="M 0 15 L 350 15 L 360 5 L 440 5 L 450 15 L 800 15" fill="none" stroke="#00F0FF" stroke-width="1.5" filter="url(#glow)" opacity="0.6"/>
  
  <!-- Circuit Nodes -->
  <circle cx="350" cy="15" r="3" fill="#00F0FF" />
  <circle cx="360" cy="5" r="3" fill="#FF003C" />
  <circle cx="440" cy="5" r="3" fill="#FF003C" />
  <circle cx="450" cy="15" r="3" fill="#00F0FF" />

  <!-- Center Hex -->
  <polygon points="390,5 400,-2 410,5 410,15 400,22 390,15" fill="none" stroke="#FCEE0A" stroke-width="1.5" transform="translate(0, 3)" />
  <circle cx="400" cy="13" r="2" fill="#FCEE0A" />
</svg>
