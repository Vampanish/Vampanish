<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="100%" height="250">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&amp;display=swap');
      
      .bg { fill: #050505; }
      
      .grid {
        stroke: rgba(0, 240, 255, 0.15);
        stroke-width: 1;
      }
      
      .scanline {
        fill: url(#scan-grad);
        animation: scan 4s linear infinite;
        opacity: 0.5;
      }
      
      @keyframes scan {
        0% { transform: translateY(-250px); }
        100% { transform: translateY(250px); }
      }

      .radar {
        stroke: #00F0FF;
        stroke-width: 1;
        fill: rgba(0, 240, 255, 0.05);
      }
      
      .radar-sweep {
        fill: url(#sweep-grad);
        transform-origin: 700px 125px;
        animation: rotate 4s linear infinite;
      }

      @keyframes rotate {
        100% { transform: rotate(360deg); }
      }
      
      .node { fill: #00F0FF; filter: drop-shadow(0 0 5px #00F0FF); }
      .node-core { fill: #FF003C; filter: drop-shadow(0 0 8px #FF003C); }
      .link { stroke: #00F0FF; stroke-width: 1.5; opacity: 0.6; }
      
      .text-core {
        font-family: 'Fira Code', monospace;
        font-size: 32px;
        font-weight: 700;
        fill: #FF003C;
        letter-spacing: 2px;
        filter: drop-shadow(0 0 5px rgba(255, 0, 60, 0.8));
      }
      
      .text-sub {
        font-family: 'Fira Code', monospace;
        font-size: 14px;
        fill: #00F0FF;
        letter-spacing: 1px;
      }

      .particle {
        fill: #00F0FF;
        animation: float 3s infinite alternate ease-in-out;
      }
      
      @keyframes float {
        0% { transform: translateY(0px) scale(0.8); opacity: 0.2; }
        100% { transform: translateY(-10px) scale(1.2); opacity: 0.8; }
      }

      .particle:nth-child(even) { animation-delay: 1.5s; fill: #FCEE0A; }
      .particle:nth-child(3n) { animation-delay: 0.5s; fill: #FF003C; }

    </style>
    
    <linearGradient id="scan-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0" />
      <stop offset="90%" stop-color="#00F0FF" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0.8" />
    </linearGradient>

    <conicGradient id="sweep-grad" cx="50%" cy="50%" angle="0deg">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.5" />
      <stop offset="15%" stop-color="#00F0FF" stop-opacity="0" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0" />
    </conicGradient>
  </defs>

  <!-- Background -->
  <rect class="bg" width="100%" height="100%" />

  <!-- Cyber Grid -->
  <g class="grid">
    <!-- Horizontal -->
    <path d="M0 25 H800 M0 50 H800 M0 75 H800 M0 100 H800 M0 125 H800 M0 150 H800 M0 175 H800 M0 200 H800 M0 225 H800" />
    <!-- Vertical -->
    <path d="M50 0 V250 M100 0 V250 M150 0 V250 M200 0 V250 M250 0 V250 M300 0 V250 M350 0 V250 M400 0 V250 M450 0 V250 M500 0 V250 M550 0 V250 M600 0 V250 M650 0 V250 M700 0 V250 M750 0 V250" />
  </g>

  <!-- Particles -->
  <g>
    <circle cx="80" cy="60" r="2" class="particle" />
    <circle cx="150" cy="180" r="1.5" class="particle" />
    <circle cx="350" cy="40" r="2" class="particle" />
    <circle cx="450" cy="200" r="1" class="particle" />
    <circle cx="550" cy="80" r="2.5" class="particle" />
  </g>

  <!-- Radar HUD -->
  <g transform="translate(0, 0)">
    <circle cx="700" cy="125" r="90" class="radar" stroke-dasharray="2 4" />
    <circle cx="700" cy="125" r="60" class="radar" />
    <circle cx="700" cy="125" r="30" class="radar" stroke-dasharray="10 5" />
    <!-- Radar Sweep (Simulated via SVG pie slice in rotation) -->
    <path class="radar-sweep" d="M700 125 L700 35 A90 90 0 0 1 790 125 Z" />
    <!-- Target Blips -->
    <circle cx="650" cy="90" r="3" class="node-core" />
    <circle cx="740" cy="160" r="2" fill="#FCEE0A" />
    <circle cx="720" cy="70" r="2" fill="#00F0FF" />
  </g>

  <!-- Node Network Overlay -->
  <g>
    <path class="link" d="M 650 90 L 580 150 L 480 130 L 420 180" />
    <path class="link" d="M 580 150 L 520 80 L 480 130" />
    
    <circle cx="580" cy="150" r="4" class="node" />
    <circle cx="480" cy="130" r="4" class="node" />
    <circle cx="420" cy="180" r="4" class="node" />
    <circle cx="520" cy="80" r="4" class="node" />
  </g>

  <!-- Typography -->
  <g transform="translate(40, 100)">
    <rect x="0" y="-35" width="420" height="80" fill="rgba(0, 240, 255, 0.05)" stroke="#00F0FF" stroke-width="2" />
    <path d="M 0 -35 L 20 -55 L 120 -55 L 140 -35" fill="none" stroke="#00F0FF" stroke-width="2" />
    <text x="30" y="-42" font-family="monospace" font-size="10" fill="#00F0FF">SYS.OP</text>

    <text x="20" y="5" class="text-core">NEURAL CORE ACTIVE</text>
    <text x="20" y="30" class="text-sub">> IDENTITY_ VERIFIED</text>
  </g>

  <!-- Hexagonal / Tech Accents -->
  <polygon points="30,220 40,210 60,210 70,220 60,230 40,230" fill="none" stroke="#FF003C" stroke-width="1.5" />
  <polygon points="75,220 85,210 105,210 115,220 105,230 85,230" fill="none" stroke="#00F0FF" stroke-width="1.5" />
  
  <text x="130" y="225" font-family="monospace" font-size="12" fill="#8B949E">[ NETWORKING // BACKEND // SIMULATION // AI ]</text>

  <!-- Scanline Overlay -->
  <rect x="0" y="0" width="800" height="250" class="scanline" pointer-events="none" />
</svg>
