<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="100%" height="250">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&amp;family=Orbitron:wght@500;700&amp;display=swap');
      
      .bg {
        fill: #0D1117;
      }
      .star {
        fill: #FFF;
        animation: twinkle 3s infinite alternate;
      }
      .star:nth-child(even) {
        animation-delay: 1.5s;
        fill: #00F0FF;
      }
      .star:nth-child(3n) {
        animation-delay: 0.5s;
        fill: #8A2BE2;
      }
      
      .grid {
        stroke: rgba(0, 240, 255, 0.1);
        stroke-width: 1;
      }

      .title {
        font-family: 'Orbitron', sans-serif;
        font-size: 52px;
        font-weight: 700;
        fill: #FFFFFF;
        letter-spacing: 4px;
        filter: drop-shadow(0 0 10px rgba(0, 240, 255, 0.5));
      }

      .subtitle {
        font-family: 'Fira Code', monospace;
        font-size: 16px;
        fill: #8B949E;
      }

      .highlight {
        fill: #00F0FF;
      }

      .typewriter-container {
        font-family: 'Fira Code', monospace;
        font-size: 18px;
        fill: #8A2BE2;
        font-weight: bold;
      }

      /* Cursor blink */
      .cursor {
        animation: blink 1s step-end infinite;
        fill: #00F0FF;
      }

      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }

      @keyframes twinkle {
        0% { opacity: 0.2; transform: scale(0.8); }
        100% { opacity: 1; transform: scale(1.2); }
      }
      
      /* Planet/Orbital elements */
      .orbit {
        stroke: rgba(138, 43, 226, 0.3);
        stroke-width: 1;
        fill: none;
        stroke-dasharray: 4 4;
        animation: rotate 60s linear infinite;
        transform-origin: 700px 125px;
      }

      .planet {
        fill: url(#grad1);
        filter: drop-shadow(0 0 15px rgba(0, 240, 255, 0.4));
      }

      @keyframes rotate {
        100% { transform: rotate(360deg); }
      }
      
      /* Typing Animation (CSS simulation of multiple strings) */
      .role-text {
        opacity: 0;
        animation: cycle 18s linear infinite;
      }
      .role-1 { animation-delay: 0s; }
      .role-2 { animation-delay: 3s; }
      .role-3 { animation-delay: 6s; }
      .role-4 { animation-delay: 9s; }
      .role-5 { animation-delay: 12s; }
      .role-6 { animation-delay: 15s; }

      @keyframes cycle {
        0%, 15% { opacity: 1; }
        16%, 100% { opacity: 0; }
      }

    </style>
    
    <radialGradient id="grad1" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" style="stop-color:#00F0FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D1117;stop-opacity:1" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect class="bg" width="100%" height="100%" rx="10" />

  <!-- Cybernetic Grid -->
  <path class="grid" d="M0 20 H800 M0 60 H800 M0 100 H800 M0 140 H800 M0 180 H800 M0 220 H800" />
  <path class="grid" d="M40 0 V250 M120 0 V250 M200 0 V250 M280 0 V250 M360 0 V250 M440 0 V250 M520 0 V250 M600 0 V250 M680 0 V250 M760 0 V250" />

  <!-- Stars Background -->
  <g id="stars">
    <circle cx="100" cy="50" r="1.5" class="star" />
    <circle cx="250" cy="80" r="1" class="star" />
    <circle cx="450" cy="30" r="2" class="star" />
    <circle cx="600" cy="90" r="1.5" class="star" />
    <circle cx="750" cy="40" r="2" class="star" />
    <circle cx="50" cy="180" r="1.5" class="star" />
    <circle cx="300" cy="200" r="1" class="star" />
    <circle cx="550" cy="220" r="2" class="star" />
    <circle cx="700" cy="180" r="1.5" class="star" />
  </g>

  <!-- Orbital Art -->
  <circle cx="700" cy="125" r="80" class="orbit" />
  <circle cx="700" cy="125" r="50" class="orbit" style="animation-direction: reverse; stroke: rgba(0, 240, 255, 0.3);" />
  <circle cx="700" cy="125" r="30" class="planet" />
  <circle cx="620" cy="125" r="4" fill="#00F0FF" />
  <circle cx="750" cy="75" r="3" fill="#8A2BE2" />

  <!-- Content -->
  <g transform="translate(40, 70)">
    <text x="0" y="0" class="title">ANISH</text>
    <text x="0" y="40" class="subtitle">Building <tspan class="highlight">Intelligent Systems</tspan>,</text>
    <text x="0" y="65" class="subtitle">Network-Scale Simulations,</text>
    <text x="0" y="90" class="subtitle">and AI-Powered Experiences.</text>
    
    <!-- Animated Role Display -->
    <g transform="translate(0, 135)" class="typewriter-container">
      <text x="0" y="0">> </text>
      <text x="20" y="0" class="role-text role-1">Computer Science Student</text>
      <text x="20" y="0" class="role-text role-2">Backend Engineer</text>
      <text x="20" y="0" class="role-text role-3">AI Enthusiast</text>
      <text x="20" y="0" class="role-text role-4">Open Source Builder</text>
      <text x="20" y="0" class="role-text role-5">Network Systems Developer</text>
      <text x="20" y="0" class="role-text role-6">Agentic AI Explorer</text>
      <rect x="240" y="-14" width="10" height="18" class="cursor" />
    </g>
  </g>
  
</svg>
